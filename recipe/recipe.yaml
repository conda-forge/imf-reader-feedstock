schema_version: 1

context:
  python_min: "3.12"
  version: "2.2.0"

package:
  name: imf-reader
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/imf-reader/imf_reader-${{ version }}.tar.gz
  sha256: 3f725d5759b0d78875833ee9a5c66cd27d61c31bd8a553ff71eee05b5e628b57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.12.3,<0.13
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=2.2.2
    - requests >=2.32.1
    - beautifulsoup4 >=4.12.3
    - pyarrow >=14.0
    - readerkit >=0.1.0

tests:
  - python:
      imports:
        - imf_reader
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: A package to access imf data
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/imf-reader/

extra:
  recipe-maintainers:
    - brynpickering
    - jm-rivera
